<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boss Mode — Story 5</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  .story { width: 1080px; height: 1920px; background: #EE3D8B; color: #F4EFE4; position: relative; overflow: hidden; font-family: var(--font-display); }
  .facets { position: absolute; inset: 0; background: url('../assets/facets-pink.png') center/cover; opacity: 0.7; mix-blend-mode: multiply; }
  .scan { position: absolute; inset: 0; background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 4px); pointer-events: none; }
  .ticks { position: absolute; inset: 60px; border: 2px solid rgba(10,10,10,0.4); pointer-events: none; }
  .top { position: absolute; top: 240px; left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 28px; letter-spacing: 0.32em; text-transform: uppercase; color: #0A0A0A; z-index: 3; }
  .stage { position: absolute; top: 460px; left: 80px; right: 80px; z-index: 3; text-align: center; }
  .heading { font-family: var(--font-display); font-weight: 900; font-size: 280px; line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase; color: #0A0A0A; }
  .sub { margin-top: 48px; font-family: var(--font-text); font-size: 38px; line-height: 1.3; color: #0A0A0A; max-width: 880px; margin-left: auto; margin-right: auto; }
  .cta { position: absolute; bottom: 480px; left: 0; right: 0; text-align: center; z-index: 3; }
  .cta-box { display: inline-flex; align-items: center; gap: 28px; background: #0A0A0A; color: #F4EFE4; padding: 44px 64px; font-family: var(--font-mono); font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 700; }
  .arrow { font-size: 48px; }
  .url-big { margin-top: 36px; font-family: var(--font-display); font-weight: 900; font-size: 76px; letter-spacing: -0.02em; color: #0A0A0A; text-transform: uppercase; }
  .bottom { position: absolute; bottom: 200px; left: 0; right: 0; text-align: center; z-index: 3; }
  .wm { font-family: var(--font-display); font-weight: 900; font-size: 56px; letter-spacing: -0.02em; line-height: 0.9; color: #0A0A0A; }
  .wm sup { font-size: 0.3em; vertical-align: top; margin-left: 0.06em; font-weight: 700; letter-spacing: 0; }
</style>
</head>
<body>
<div class="story">
  <div class="facets"></div>
  <div class="scan"></div>
  <div class="ticks"></div>
  <div class="top">— Pre-launch · Waitlist Open —</div>
  <div class="stage">
    <div class="heading">Get on<br>the list.</div>
    <div class="sub">Launch-day pricing. Early-supporter discount. First crack at the world's first RTD peptide shake.</div>
  </div>
  <div class="cta">
    <div class="cta-box">Join now <span class="arrow">→</span></div>
    <div class="url-big">drinkbossmode.net</div>
  </div>
  <div class="bottom"><div class="wm">BOSS MODE<sup>™</sup></div></div>
</div>
</body>
</html>
