<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boss Mode — Story 1 · 144%</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: #1a1a1a; }
  .story { width: 1080px; height: 1920px; background: #0A0A0A; color: #F4EFE4; position: relative; overflow: hidden; font-family: var(--font-display); }
  .scan { position: absolute; inset: 0; background-image: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 4px); pointer-events: none; }
  .top { position: absolute; top: 220px; left: 80px; right: 80px; font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.32em; text-transform: uppercase; color: #EE3D8B; text-align: center; }
  .stat { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-52%); text-align: center; }
  .num { font-family: var(--font-display); font-weight: 900; font-size: 720px; line-height: 0.85; letter-spacing: -0.05em; color: #EE3D8B; text-shadow: 16px 16px 0 rgba(238, 61, 139, 0.18); }
  .lab { font-family: var(--font-mono); font-size: 36px; letter-spacing: 0.22em; text-transform: uppercase; color: #F4EFE4; margin-top: 40px; }
  .ref { font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.18em; color: rgba(244,239,228,0.45); margin-top: 24px; }
  .swipe { position: absolute; bottom: 280px; left: 0; right: 0; text-align: center; font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(244,239,228,0.7); }
  .swipe .arrow { display: block; font-size: 48px; margin-top: 12px; color: #EE3D8B; }
  .bottom { position: absolute; bottom: 200px; left: 0; right: 0; text-align: center; }
  .wm { font-family: var(--font-display); font-weight: 900; font-size: 64px; letter-spacing: -0.02em; line-height: 0.9; color: #F4EFE4; }
  .wm sup { font-size: 0.3em; vertical-align: top; margin-left: 0.06em; font-weight: 700; letter-spacing: 0; }
  .url { margin-top: 16px; font-family: var(--font-mono); font-size: 20px; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(244,239,228,0.55); }
</style>
</head>
<body>
<div class="story">
  <div class="scan"></div>
  <div class="top">— Faster recovery · stat 01 —</div>
  <div class="stat">
    <div class="num">144%</div>
    <div class="lab">vs control · 8-wk trial</div>
    <div class="ref">PeptiStrong® · 2.4g clinically dosed</div>
  </div>
  <div class="swipe">Swipe up to learn more<span class="arrow">↑</span></div>
  <div class="bottom"><div class="wm">BOSS MODE<sup>™</sup></div><div class="url">drinkbossmode.net</div></div>
</div>
</body>
</html>
