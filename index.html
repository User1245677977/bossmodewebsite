<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss Mode™ — Sip. Dominate. Repeat.™</title>
  <meta name="description" content="Clean, performance-driven energy and the world's first RTD peptide shakes. Built in adversity. Forged for everyone.">

  <!-- Brand fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Barlow+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Design tokens — now at root level -->
  <link rel="stylesheet" href="colors_and_type.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bm-paper); overflow-x: hidden; }
    #root { min-height: 100vh; }
    img, video { max-width: 100%; height: auto; display: block; }
    a { color: inherit; }
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--bm-ink); border-radius: 4px; }

    :root {
      --font-display: 'Orbitron', sans-serif;
      --font-text:    'Barlow Condensed', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      --bm-neon:      #39FF14;
      --ease-out:     cubic-bezier(.2,.7,.2,1);
    }

    .bm-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bm-pink);
      margin-bottom: 16px;
    }
    .bm-capsule {
      display: inline-flex;
      align-items: center;
      background: var(--bm-pink);
      color: #fff;
      border-radius: 999px;
      padding: 8px 18px;
      font-family: var(--font-text);
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .bm-hero-inner {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 48px;
      align-items: center;
      padding: 100px 48px 80px;
    }
    .bm-hero-h1 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(56px, 8vw, 108px);
      line-height: 0.88;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      margin: 0 0 20px;
      color: var(--bm-paper);
    }
    .bm-hero-p {
      font-size: 17px;
      line-height: 1.5;
      color: rgba(244,239,228,0.8);
      max-width: 480px;
      margin-bottom: 28px;
    }
    .bm-hero-form { display: flex; max-width: 460px; margin-bottom: 12px; }
    .bm-hero-form input {
      flex: 1; height: 52px; padding: 0 16px;
      background: #fff; border: 2px solid var(--bm-paper);
      border-right: none; border-radius: 4px 0 0 4px;
      font-family: var(--font-text); font-weight: 700;
      font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
      outline: none; color: var(--bm-ink);
    }
    .bm-hero-form input::placeholder {
      color: #999; font-family: var(--font-text); font-weight: 700;
      font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase;
    }
    .bm-hero-form button {
      height: 52px; padding: 0 22px;
      background: var(--bm-pink); color: #fff;
      border: 2px solid var(--bm-paper); border-radius: 0 4px 4px 0;
      font-family: var(--font-text); font-weight: 700;
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      cursor: pointer; box-shadow: 4px 4px 0 0 var(--bm-paper);
      transition: all 120ms var(--ease-out); white-space: nowrap;
    }
    .bm-hero-form button:hover {
      background: var(--bm-pink-deep);
      box-shadow: 2px 2px 0 0 var(--bm-paper);
      transform: translate(2px, 2px);
    }
    .bm-hero-cans {
      position: relative; height: 520px;
      display: flex; align-items: center; justify-content: center; gap: 16px;
    }
    h2 {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(36px, 5.5vw, 80px); line-height: 0.92;
      letter-spacing: -0.02em; text-transform: uppercase; margin: 12px 0 0;
    }
    .bm-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    .bm-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .bm-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .bm-grid-founder { display: grid; grid-template-columns: 1fr 1.4fr; gap: 56px; align-items: center; }
    .bm-section-pad { padding: 96px 48px; }
    .bm-product-card:hover { transform: translate(-3px, -3px) !important; }
    .bm-nav {
      position: sticky !important; top: 0 !important; z-index: 30 !important;
      background: var(--bm-paper) !important;
      border-bottom: 1.5px solid var(--bm-ink) !important;
      height: 68px !important; padding: 0 48px !important;
    }
    .bm-btn:hover {
      box-shadow: 2px 2px 0 0 var(--bm-ink) !important;
      transform: translate(2px, 2px);
    }
    .bm-footer-nl { grid-template-columns: 1.2fr 1fr; }
    .bm-footer-cols { grid-template-columns: 1.4fr 1fr 1fr 1fr; }

    @media (max-width: 900px) {
      .bm-nav { padding: 0 20px !important; height: 64px !important; }
      .bm-nav-links { display: none !important; }
      .bm-nav-account, .bm-nav-shop { display: none !important; }
      .bm-nav-burger { display: inline-flex !important; }
      .bm-nav-mobile-panel { top: 64px !important; }
      .bm-hero-inner { grid-template-columns: 1fr !important; padding: 80px 20px 48px !important; gap: 32px !important; }
      .bm-hero-cans { height: 300px !important; }
      .bm-hero-h1 { font-size: clamp(48px, 11vw, 80px) !important; }
      .bm-grid-3 { grid-template-columns: repeat(2, 1fr) !important; }
      .bm-grid-4 { grid-template-columns: repeat(2, 1fr) !important; }
      .bm-grid-founder { grid-template-columns: 1fr !important; gap: 32px !important; }
      .bm-section-pad { padding: 64px 24px !important; }
      h2 { font-size: clamp(32px, 7vw, 56px) !important; }
      .bm-footer-nl { grid-template-columns: 1fr !important; gap: 28px !important; }
      .bm-footer-cols { grid-template-columns: 1fr 1fr !important; gap: 28px !important; }
      .bm-pdp-hero { grid-template-columns: 1fr !important; }
      .bm-pdp-info { padding: 40px 20px !important; }
      .bm-mission-grid { grid-template-columns: 1fr !important; }
      [style*="grid-template-columns: repeat(3"],
      [style*="gridTemplateColumns: 'repeat(3"] { grid-template-columns: repeat(2, 1fr) !important; }
      [style*="grid-template-columns: 1fr 1.4fr"],
      [style*="grid-template-columns: 1.2fr 1fr"],
      [style*="grid-template-columns: 1fr 2fr"],
      [style*="grid-template-columns: 2fr 1fr"] { grid-template-columns: 1fr !important; }
    }

    @media (max-width: 600px) {
      .bm-grid-3, .bm-grid-4, .bm-grid-2 { grid-template-columns: 1fr !important; gap: 16px !important; }
      .bm-section-pad { padding: 48px 20px !important; }
      h2 { font-size: clamp(28px, 9vw, 44px) !important; }
      .bm-hero-form { flex-direction: column !important; gap: 8px !important; }
      .bm-hero-form input { border-right: 2px solid var(--bm-paper) !important; border-radius: 4px !important; }
      .bm-hero-form button { border-radius: 4px !important; box-shadow: 4px 4px 0 0 var(--bm-paper) !important; }
      section { padding: 48px 20px !important; }
      footer { padding: 48px 20px 24px !important; }
      [style*="position: sticky"] { position: static !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- All paths now point to the site/ subfolder -->
  <script type="text/babel" src="site/ui.jsx"></script>
  <script type="text/babel" src="site/cart.jsx"></script>
  <script type="text/babel" src="site/router.jsx"></script>
  <script type="text/babel" src="site/Nav.jsx"></script>
  <script type="text/babel" src="site/Footer.jsx"></script>
  <script type="text/babel" src="site/CartDrawer.jsx"></script>
  <script type="text/babel" src="site/scroll-utils.jsx"></script>
  <script type="text/babel" src="site/VariantB.jsx"></script>
  <script type="text/babel" src="site/HomePage.jsx"></script>
  <script type="text/babel" src="site/ShopPage.jsx"></script>
  <script type="text/babel" src="site/ProductPage.jsx"></script>
  <script type="text/babel" src="site/SciencePage.jsx"></script>
  <script type="text/babel" src="site/AboutPage.jsx"></script>

  <script type="text/babel">
    function PreLaunchBanner() {
      return (
        <div style={{
          background: 'var(--bm-ink)', color: 'var(--bm-paper)',
          padding: '10px 56px', textAlign: 'center',
          fontFamily: 'var(--font-mono)', fontSize: 11,
          letterSpacing: '0.16em', textTransform: 'uppercase',
        }}>
          Pre-launch · <span style={{ color: 'var(--bm-pink)' }}>Get on the waitlist</span> for first access + launch-day discount
        </div>
      );
    }

    function Router() {
      const route = useHashRoute();
      const [pathOnly] = route.path.split('?');
      const parts = pathOnly.split('/').filter(Boolean);

      let body = null;
      let label = 'Home';

      if (parts.length === 0) {
        body = <HomePage />; label = '01 Home';
      } else if (parts[0] === 'shop') {
        body = <ShopPage />; label = '02 Shop';
      } else if (parts[0] === 'product' && parts[1]) {
        body = <ProductPage productId={parts[1]} />; label = `03 PDP · ${parts[1]}`;
      } else if (parts[0] === 'science') {
        body = <SciencePage />; label = '04 Science';
      } else if (parts[0] === 'about') {
        body = <AboutPage />; label = '05 About';
      } else {
        body = <HomePage />; label = '01 Home';
      }

      return (
        <div data-screen-label={label}>
          <PreLaunchBanner />
          <Nav />
          {body}
          <Footer />
          <CartDrawer />
        </div>
      );
    }

    function App() {
      return (
        <CartProvider>
          <Router />
        </CartProvider>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
