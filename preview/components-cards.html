<!doctype html><html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { background: #fff; border: 2px solid var(--bm-ink); border-radius: 8px; box-shadow: 6px 6px 0 0 var(--bm-ink); padding: 18px; }
  .card-energy { background: var(--bm-royal); color: #fff; border-color: var(--bm-blue); box-shadow: 6px 6px 0 0 var(--bm-blue); }
  .card-soft { background: var(--bm-pink-bg); border: 1px solid var(--bm-pink-soft); border-radius: 8px; box-shadow: none; padding: 18px; }
</style>
</head><body>
<div class="lbl-eyebrow">Card Variants</div>
<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap: 16px;">
  <div class="card">
    <span class="eyebrow">01 / Pillar</span>
    <h3 style="font-size: 18px; margin-top: 8px;">Clean Energy</h3>
    <p style="font-size: 13px; margin: 8px 0 0; color: var(--fg-2);">Green tea caffeine + L-theanine. No crash.</p>
  </div>
  <div class="card card-energy">
    <span class="eyebrow" style="color: rgba(255,255,255,.7);">02 / Pillar</span>
    <h3 style="font-size: 18px; margin-top: 8px; color: #fff;">Peak Focus</h3>
    <p style="font-size: 13px; margin: 8px 0 0; color: rgba(255,255,255,.78);">Cognizin® citicoline. CognatiQ®.</p>
  </div>
  <div class="card card-soft">
    <span class="eyebrow" style="color: var(--bm-pink-deep);">03 / Pillar</span>
    <h3 style="font-size: 18px; margin-top: 8px;">RTD Convenience</h3>
    <p style="font-size: 13px; margin: 8px 0 0; color: var(--fg-2);">12 fl oz. Shelf-stable. Grab + go.</p>
  </div>
</div>
</body></html>
