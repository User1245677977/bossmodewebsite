<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Spacing Scale (4px base)</div>
<div style="display: flex; align-items: flex-end; gap: 8px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:4px;height:4px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">1·4</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:8px;height:8px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">2·8</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:12px;height:12px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">3·12</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:16px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">4·16</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:24px;height:24px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">5·24</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:32px;height:32px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">6·32</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:48px;height:48px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">7·48</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:64px;height:64px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">8·64</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:96px;height:96px;background:var(--bm-pink);"></div><span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);">9·96</span></div>
</div>
</body></html>
