<!doctype html><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Shadow System — Hard, Athletic-Poster</div>
<div style="display: flex; gap: 32px; align-items: flex-start; padding: 12px 24px 32px;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:120px;height:80px;background:var(--bm-paper);border:2px solid var(--bm-ink);box-shadow: 3px 3px 0 0 var(--bm-ink);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;">--shadow-hard-sm</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:120px;height:80px;background:var(--bm-paper);border:2px solid var(--bm-ink);box-shadow: 6px 6px 0 0 var(--bm-ink);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;">--shadow-hard-md</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:120px;height:80px;background:var(--bm-paper);border:2px solid var(--bm-ink);box-shadow: 10px 10px 0 0 var(--bm-ink);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;">--shadow-hard-lg</span>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
    <div style="width:120px;height:80px;background:#fff;border-radius:8px;box-shadow: 0 1px 2px rgba(10,10,10,.06), 0 8px 24px rgba(10,10,10,.08);"></div>
    <span style="font-family:var(--font-mono);font-size:11px;">--shadow-ambient</span>
  </div>
</div>
</body></html>
