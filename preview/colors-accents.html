<!doctype html><html><head><meta charset="utf-8"><title>Pink Scale</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Signal Pink — Myo-Peptide Accent</div>
<div class="grid" style="grid-template-columns: repeat(4, 1fr);">
  <div class="swatch" style="background: var(--bm-pink-bg); color: var(--bm-ink);">
    <span class="name">Pink BG</span><span class="hex">#FBE4EE</span>
  </div>
  <div class="swatch" style="background: var(--bm-pink-soft); color: var(--bm-ink);">
    <span class="name">Soft</span><span class="hex">#F8C5DC</span>
  </div>
  <div class="swatch" style="background: var(--bm-pink); color: #fff;">
    <span class="name">Signal</span><span class="hex">#EE3D8B</span>
  </div>
  <div class="swatch" style="background: var(--bm-pink-deep); color: #fff;">
    <span class="name">Deep</span><span class="hex">#C61E6A</span>
  </div>
</div>
<div style="height: 12px;"></div>
<div class="lbl-eyebrow">Royal + Plum — Energy / Apex</div>
<div class="grid" style="grid-template-columns: repeat(4, 1fr);">
  <div class="swatch" style="background: var(--bm-royal-2); color: #fff;">
    <span class="name">Royal Light</span><span class="hex">#3F3D9B</span>
  </div>
  <div class="swatch" style="background: var(--bm-royal); color: #fff;">
    <span class="name">Royal</span><span class="hex">#2B2A82</span>
  </div>
  <div class="swatch" style="background: var(--bm-royal-deep); color: #fff;">
    <span class="name">Royal Deep</span><span class="hex">#1B1A5E</span>
  </div>
  <div class="swatch" style="background: var(--bm-plum-deep); color: #fff;">
    <span class="name">Plum Deep</span><span class="hex">#3D1A4E</span>
  </div>
</div>
</body></html>
