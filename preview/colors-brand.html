<!doctype html><html><head><meta charset="utf-8"><title>Brand Palette</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Core Brand Colors</div>
<div class="grid" style="grid-template-columns: repeat(4, 1fr);">
  <div class="swatch" style="background: var(--bm-ink); color: #fff;">
    <span class="name">Ink</span><span class="hex">#0A0A0A</span>
  </div>
  <div class="swatch" style="background: var(--bm-paper); color: var(--bm-ink); box-shadow: var(--shadow-inset);">
    <span class="name">Paper</span><span class="hex">#F4EFE4</span>
  </div>
  <div class="swatch" style="background: var(--bm-pink); color: #fff;">
    <span class="name">Signal Pink</span><span class="hex">#EE3D8B</span>
  </div>
  <div class="swatch" style="background: var(--bm-blue); color: var(--bm-ink);">
    <span class="name">Electric Blue</span><span class="hex">#2BB6E8</span>
  </div>
  <div class="swatch" style="background: var(--bm-royal); color: #fff;">
    <span class="name">Royal</span><span class="hex">#2B2A82</span>
  </div>
  <div class="swatch" style="background: var(--bm-plum); color: #fff;">
    <span class="name">Plum</span><span class="hex">#6B2A82</span>
  </div>
  <div class="swatch" style="background: var(--bm-red); color: #fff;">
    <span class="name">Candied Red</span><span class="hex">#C8102E</span>
  </div>
  <div class="swatch" style="background: var(--bm-sun); color: var(--bm-ink);">
    <span class="name">Sun</span><span class="hex">#F5C72E</span>
  </div>
</div>
</body></html>
