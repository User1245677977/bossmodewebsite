<!doctype html><html><head><meta charset="utf-8"><title>Neutrals (Grade)</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Grade — Warm Neutral Scale</div>
<div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 0;">
  <div class="swatch" style="background: var(--bm-grade-50); color: var(--bm-ink); border-radius: 8px 0 0 8px;">
    <span class="name">50</span><span class="hex">#F8F5EE</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-100); color: var(--bm-ink); border-radius: 0;">
    <span class="name">100</span><span class="hex">#ECE7DC</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-200); color: var(--bm-ink); border-radius: 0;">
    <span class="name">200</span><span class="hex">#D6D0C2</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-300); color: var(--bm-ink); border-radius: 0;">
    <span class="name">300</span><span class="hex">#B0A99A</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-400); color: #fff; border-radius: 0 8px 8px 0;">
    <span class="name">400</span><span class="hex">#837D70</span>
  </div>
</div>
<div style="height: 8px;"></div>
<div class="grid" style="grid-template-columns: repeat(5, 1fr); gap: 0;">
  <div class="swatch" style="background: var(--bm-grade-500); color: #fff; border-radius: 8px 0 0 8px;">
    <span class="name">500</span><span class="hex">#5A554B</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-600); color: #fff; border-radius: 0;">
    <span class="name">600</span><span class="hex">#3D3A33</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-700); color: #fff; border-radius: 0;">
    <span class="name">700</span><span class="hex">#2A2823</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-800); color: #fff; border-radius: 0;">
    <span class="name">800</span><span class="hex">#1A1916</span>
  </div>
  <div class="swatch" style="background: var(--bm-grade-900); color: #fff; border-radius: 0 8px 8px 0;">
    <span class="name">900</span><span class="hex">#0E0D0B</span>
  </div>
</div>
</body></html>
