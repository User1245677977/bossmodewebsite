<!doctype html><html><head><meta charset="utf-8"><title>Semantic / Surfaces</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Semantic Tokens (Myo / Default Context)</div>
<div class="grid" style="grid-template-columns: repeat(3, 1fr);">
  <div class="swatch" style="background: var(--bg); color: var(--fg); border: 1px solid var(--line);">
    <span class="name">--bg</span><span class="hex">#F4EFE4</span>
  </div>
  <div class="swatch" style="background: var(--bg-elev); color: var(--fg); border: 1px solid var(--line);">
    <span class="name">--bg-elev</span><span class="hex">#FFFFFF</span>
  </div>
  <div class="swatch" style="background: var(--bg-sunken); color: var(--fg);">
    <span class="name">--bg-sunken</span><span class="hex">#EBE5D7</span>
  </div>
  <div class="swatch" style="background: var(--accent); color: var(--accent-on);">
    <span class="name">--accent</span><span class="hex">#EE3D8B</span>
  </div>
  <div class="swatch" style="background: var(--bm-success); color: #fff;">
    <span class="name">success</span><span class="hex">#2EA86F</span>
  </div>
  <div class="swatch" style="background: var(--bm-error); color: #fff;">
    <span class="name">error</span><span class="hex">#E53935</span>
  </div>
</div>
<div style="height: 12px;"></div>
<div data-product="energy" style="border-radius: 8px; padding: 12px; background: var(--bg);">
  <div class="lbl-eyebrow" style="color: var(--fg-3);">Energy Context (data-product="energy")</div>
  <div class="grid" style="grid-template-columns: repeat(3, 1fr);">
    <div class="swatch" style="background: var(--bg); color: var(--fg);"><span class="name">--bg</span><span class="hex">Royal Deep</span></div>
    <div class="swatch" style="background: var(--bg-elev); color: var(--fg);"><span class="name">--bg-elev</span><span class="hex">Royal</span></div>
    <div class="swatch" style="background: var(--accent); color: var(--accent-on);"><span class="name">--accent</span><span class="hex">Electric Blue</span></div>
  </div>
</div>
</body></html>
