<!doctype html><html><head><meta charset="utf-8"><title>Logos</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Brand Logos</div>
<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; align-items: stretch;">
  <div style="background: var(--bm-paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display:flex;align-items:center;justify-content:center;height:200px;">
    <img src="../assets/logo-energy.png" style="max-width: 70%; max-height: 100%; object-fit: contain;">
  </div>
  <div style="background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; display:flex;align-items:center;justify-content:center;height:200px;">
    <img src="../assets/logo-myo.png" style="max-width: 90%; max-height: 100%; object-fit: contain;">
  </div>
  <div style="background: var(--bm-ink); border-radius: 8px; padding: 16px; display:flex;align-items:center;justify-content:center;height:200px;">
    <img src="../assets/logo-myo-peptide-clean.png" style="max-width: 90%; max-height: 100%; object-fit: contain;">
  </div>
</div>
</body></html>
