<!doctype html><html><head><meta charset="utf-8"><title>Eyebrow + Numeric</title>
<link rel="stylesheet" href="_card.css">
</head><body>
<div class="lbl-eyebrow">Eyebrows + Stats</div>
<div style="display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;">
  <span class="eyebrow">FEATURING PeptiStrong®</span>
  <span class="eyebrow" style="color: var(--bm-pink);">UNLOCK PEAK STATE</span>
  <span class="eyebrow" style="color: var(--bm-blue-deep);">SIP. DOMINATE. REPEAT.</span>
</div>
<div style="height: 18px;"></div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
  <div>
    <div class="stat" style="color: var(--bm-pink);">20g</div>
    <div class="eyebrow">PROTEIN</div>
  </div>
  <div>
    <div class="stat" style="color: var(--bm-pink);">2.4g</div>
    <div class="eyebrow">PEPTISTRONG®</div>
  </div>
  <div>
    <div class="stat" style="color: var(--bm-pink);">5g</div>
    <div class="eyebrow">SUGAR</div>
  </div>
  <div>
    <div class="stat" style="color: var(--bm-pink);">0</div>
    <div class="eyebrow">ARTIFICIAL</div>
  </div>
</div>
</body></html>
