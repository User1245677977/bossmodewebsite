<!doctype html><html><head><meta charset="utf-8"><title>Form Inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-family: var(--font-text); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-2); }
  .field input, .field select { height: 44px; padding: 0 14px; border: 2px solid var(--bm-ink); border-radius: 4px; background: #fff; font-family: var(--font-text); font-size: 14px; color: var(--bm-ink); }
  .field input:focus { outline: none; box-shadow: 4px 4px 0 0 var(--bm-pink); }
  .check { display:flex; align-items:center; gap:10px; font-family: var(--font-text); font-size: 14px;}
  .check input { width: 18px; height: 18px; accent-color: var(--bm-pink); }
</style>
</head><body>
<div class="lbl-eyebrow">Form Inputs</div>
<div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
  <div class="field">
    <label>Email</label>
    <input type="email" placeholder="you@bossmode.com">
  </div>
  <div class="field">
    <label>Quantity</label>
    <select><option>12-pack</option><option>24-pack</option></select>
  </div>
</div>
<div style="height: 16px;"></div>
<div style="display:flex; gap: 24px;">
  <label class="check"><input type="checkbox" checked> Subscribe & save 15%</label>
  <label class="check"><input type="checkbox"> Notify me when back</label>
</div>
</body></html>
