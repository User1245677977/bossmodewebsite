<!doctype html><html><head><meta charset="utf-8"><title>Capsules / Pills</title>
<link rel="stylesheet" href="_card.css">
<style>
  .cap { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-family: var(--font-text); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
  .cap-pink { background: var(--bm-pink); color: #fff; }
  .cap-blue { background: var(--bm-blue); color: var(--bm-ink); }
  .cap-ink { background: var(--bm-ink); color: var(--bm-paper); }
  .cap-outline { background: transparent; color: var(--bm-ink); border: 1.5px solid var(--bm-ink); }
  .cap-soft { background: var(--bm-pink-bg); color: var(--bm-pink-deep); }
</style>
</head><body>
<div class="lbl-eyebrow">Capsules — Flavor + Ingredient Tags</div>
<div style="display:flex; gap:8px; flex-wrap: wrap;">
  <span class="cap cap-pink">Strawberry Milkshake</span>
  <span class="cap cap-blue">Apex Punch</span>
  <span class="cap cap-ink">Vanilla Marshmallow</span>
  <span class="cap cap-outline">Chai Latte</span>
  <span class="cap cap-soft">Frosted Lemonade</span>
</div>
<div style="height: 16px;"></div>
<div class="lbl-eyebrow">Stat Capsule (cans use this for "20g PROTEIN")</div>
<div style="display:flex; gap:10px;">
  <span class="cap cap-pink"><span style="font-family:var(--font-display);font-size:14px;letter-spacing:0;">20g</span> PROTEIN</span>
  <span class="cap cap-pink"><span style="font-family:var(--font-display);font-size:14px;letter-spacing:0;">2.4g</span> PEPTISTRONG®</span>
  <span class="cap cap-blue"><span style="font-family:var(--font-display);font-size:14px;letter-spacing:0;">5g</span> SUGAR</span>
</div>
</body></html>
